<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 
                        0 0 1px rgba(255, 255, 255, 0.3) inset;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transform: translateZ(0);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.320, 1);
            animation: floatIn 0.8s ease-out;
        }

        .container:hover {
            box-shadow: 0 30px 80px rgba(102, 126, 234, 0.4),
                        0 0 1px rgba(255, 255, 255, 0.3) inset;
            transform: translateY(-5px) translateZ(0);
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) translateZ(0);
            }
            to {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        h2 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2.5rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.2);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .amount {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        label {
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #555;
        }

        input[type="number"] {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid transparent;
            border-radius: 0.8rem;
            font-size: 1.05rem;
            background: linear-gradient(rgba(255, 255, 255, 1), rgba(255, 255, 255, 1)) 
                        padding-box,
                        linear-gradient(135deg, #667eea, #764ba2) border-box;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        input[type="number"]:focus {
            outline: none;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
            border: 2px solid transparent;
        }

        input[type="number"]::placeholder {
            color: #999;
        }

        .dropdown {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.8rem;
            width: 100%;
        }

        .from, .to {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .select-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 0.8rem;
            border-radius: 1rem;
            border: 2px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .select-container:hover {
            border-color: rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.15);
        }

        .select-container img {
            width: 2rem;
            height: 1.2rem;
            object-fit: cover;
            border-radius: 0.4rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .select-container select {
            flex: 1;
            padding: 0.5rem 0.8rem;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            color: #333;
            transition: all 0.2s ease;
            width: 100%;
        }

        .select-container select:focus {
            outline: none;
        }

        .dropdown > div:nth-child(2) {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding-top: 1.8rem;
            min-width: 2rem;
        }

        .dropdown i {
            font-size: 1.8rem;
            color: #667eea;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
            cursor: pointer;
        }

        .dropdown i:hover {
            transform: rotate(180deg) scale(1.1);
            color: #764ba2;
        }

        .msg {
            padding: 1.2rem;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-left: 4px solid transparent;
            border-image: linear-gradient(135deg, #667eea, #764ba2) 1;
            border-radius: 0.8rem;
            color: #333;
            font-weight: 600;
            font-size: 1rem;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
        }

        .msg:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            transform: translateX(2px);
        }

        button {
            width: 100%;
            padding: 1rem;
            height: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 2rem;
                width: 95%;
                margin: 1rem;
            }

            h2 {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            form {
                gap: 1.2rem;
            }

            .dropdown {
                gap: 0.8rem;
            }

            .dropdown i {
                font-size: 1.4rem;
            }

            label {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>💱 Currency Converter</h2>
        <form id="currencyForm">
            <div class="amount">
                <label for="amountInput">Enter Amount</label>
                <input type="number" id="amountInput" value="1" min="0.01" step="0.01" required>
            </div>
            
            <div class="dropdown">
                <div class="from">
                    <label for="fromCurr">From</label>
                    <div class="select-container">
                        <img id="fromFlag" src="https://flagcdn.com/16x12/us.png" alt="From flag" loading="lazy">
                        <select name="from" id="fromCurr" required>
                            <option value="">Select Currency</option>
                        </select>
                    </div>
                </div>
                
                <div style="display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 0.5rem;">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </div>
                
                <div class="to">
                    <label for="toCurr">To</label>
                    <div class="select-container">
                        <img id="toFlag" src="https://flagcdn.com/16x12/in.png" alt="To flag" loading="lazy">
                        <select name="to" id="toCurr" required>
                            <option value="">Select Currency</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="msg" id="exchangeMsg">1 USD = Loading...</div>
            <button type="submit">Get Exchange Rate</button>
        </form>
    </div>

    <script>
        // ===== CURRENCY CONVERTER APPLICATION =====
        
        // API Configuration
        const API_BASE = "https://api.exchangerate-api.com/v4/latest";

        // Country Code Mapping for Flags
        const countryList = {
            AED: "ae", AFN: "af", ALL: "al", AMD: "am", ANG: "cw", AOA: "ao",
            ARS: "ar", AUD: "au", AZN: "az", BSD: "bs", BDT: "bd", BBD: "bb",
            BYN: "by", BEF: "be", BZD: "bz", BMD: "bm", BTN: "bt", BOB: "bo",
            BAM: "ba", BWP: "bw", BRL: "br", GBP: "gb", BND: "bn", BGN: "bg",
            BIF: "bi", KHR: "kh", CAD: "ca", CVE: "cv", CNY: "cn", COP: "co",
            KMF: "km", CDF: "cd", CRC: "cr", HRK: "hr", CUP: "cu", CYP: "cy",
            CZK: "cz", DKK: "dk", DJF: "dj", DOP: "do", EGP: "eg", SVC: "sv",
            ERN: "er", EEK: "ee", ETB: "et", EUR: "fr", FKP: "fk", FJD: "fj",
            GMD: "gm", GEL: "ge", DEM: "de", GHS: "gh", GIP: "gi", GRD: "gr",
            GTQ: "gt", GNF: "gn", GYD: "gy", HTG: "ht", HNL: "hn", HKD: "hk",
            HUF: "hu", ISK: "is", INR: "in", IDR: "id", IRR: "ir", IQD: "iq",
            IEP: "ie", ILS: "il", ITL: "it", JMD: "jm", JPY: "jp", JOD: "jo",
            KZT: "kz", KES: "ke", KWD: "kw", KGS: "kg", LAK: "la", LVL: "lv",
            LBP: "lb", LSL: "ls", LRD: "lr", LYD: "ly", CHF: "ch", LTL: "lt",
            LUF: "lu", MOP: "mo", MKD: "mk", MGA: "mg", MWK: "mw", MYR: "my",
            MVR: "mv", MTL: "mt", MRU: "mr", MUR: "mu", MXN: "mx", MZN: "mz",
            MMK: "mm", NAD: "na", NPR: "np", NZD: "nz", NIO: "ni", NGN: "ng",
            NOK: "no", OMR: "om", PKR: "pk", PAB: "pa", PGK: "pg", PYG: "py",
            PEN: "pe", PHP: "ph", PLN: "pl", QAR: "qa", RON: "ro", RUB: "ru",
            RWF: "rw", STN: "st", SAR: "sa", RSD: "rs", SCR: "sc", SLL: "sl",
            SGD: "sg", SKK: "sk", SBD: "sb", SOS: "so", ZAR: "za", KRW: "kr",
            ESP: "es", LKR: "lk", SRD: "sr", SZL: "sz", SEK: "se", SYP: "sy",
            TWD: "tw", TJS: "tj", TZS: "tz", THB: "th", TOP: "to", TTD: "tt",
            TND: "tn", TRY: "tr", TMT: "tm", UGX: "ug", UAH: "ua", USD: "us",
            UYU: "uy", UZS: "uz", VUV: "vu", VEF: "ve", VND: "vn", XPF: "wf",
            WST: "ws", YER: "ye", ZMW: "zm", ZWD: "zw", XAG: "xag", XAU: "xau", XPD: "xpd", XPT: "xpt", XTS: "xts", XXX: "xx"
        };

        // Get DOM Elements
        const form = document.getElementById("currencyForm");
        const amountInput = document.getElementById("amountInput");
        const fromCurr = document.getElementById("fromCurr");
        const toCurr = document.getElementById("toCurr");
        const fromFlag = document.getElementById("fromFlag");
        const toFlag = document.getElementById("toFlag");
        const exchangeMsg = document.getElementById("exchangeMsg");

        // ===== INITIALIZATION =====
        document.addEventListener("DOMContentLoaded", function() {
            console.log("🚀 Application Starting...");
            initializeApp();
        });

        function initializeApp() {
            console.log("📋 Step 1: Populating currencies...");
            populateDropdowns();
            
            console.log("🔗 Step 2: Attaching event listeners...");
            setupEventListeners();
            
            console.log("💱 Step 3: Loading initial exchange rate...");
            setTimeout(() => {
                updateExchangeRate();
            }, 500);
        }

        // ===== POPULATE DROPDOWNS =====
        function populateDropdowns() {
            const currencies = Object.keys(countryList).sort();
            
            // Clear existing options
            fromCurr.innerHTML = '<option value="">Select Currency</option>';
            toCurr.innerHTML = '<option value="">Select Currency</option>';
            
            // Add all currencies
            currencies.forEach(code => {
                // From dropdown
                const option1 = new Option(code, code);
                fromCurr.appendChild(option1);
                
                // To dropdown  
                const option2 = new Option(code, code);
                toCurr.appendChild(option2);
            });
            
            // Set defaults
            fromCurr.value = "USD";
            toCurr.value = "INR";
            
            console.log(`✅ Added ${currencies.length} currencies`);
            updateFlags();
        }

        // ===== EVENT LISTENERS =====
        function setupEventListeners() {
            // Form Submit
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                console.log("📤 Convert button clicked");
                updateExchangeRate();
            });

            // Amount Input - Real-time update on every keystroke
            amountInput.addEventListener("input", () => {
                console.log("💰 Amount changed: " + amountInput.value);
                updateExchangeRate();
            });

            // From Currency Change
            fromCurr.addEventListener("change", () => {
                console.log("🔄 From currency: " + fromCurr.value);
                updateFlags();
                updateExchangeRate();
            });

            // To Currency Change
            toCurr.addEventListener("change", () => {
                console.log("🔄 To currency: " + toCurr.value);
                updateFlags();
                updateExchangeRate();
            });

            console.log("✅ Event listeners attached");
        }

        // ===== UPDATE FLAGS =====
        function updateFlags() {
            const fromCode = countryList[fromCurr.value];
            const toCode = countryList[toCurr.value];

            if (fromCode) {
                fromFlag.src = `https://flagcdn.com/16x12/${fromCode}.png`;
                fromFlag.alt = `${fromCurr.value}`;
            }

            if (toCode) {
                toFlag.src = `https://flagcdn.com/16x12/${toCode}.png`;
                toFlag.alt = `${toCurr.value}`;
            }
        }

        // ===== MAIN CONVERSION FUNCTION =====
        async function updateExchangeRate() {
            try {
                // Get Values
                let amount = parseFloat(amountInput.value) || 1;
                const from = fromCurr.value;
                const to = toCurr.value;

                // Validation
                if (!amount || amount <= 0) {
                    amount = 1;
                    amountInput.value = "1";
                }

                if (!from || !to) {
                    exchangeMsg.textContent = "⚠️ Please select both currencies";
                    return;
                }

                // Show Loading
                exchangeMsg.textContent = "🔄 Converting...";
                console.log(`🌐 Fetching rate for ${from} to ${to}...`);

                // Fetch Exchange Rate
                const url = `${API_BASE}/${from}`;
                const response = await fetch(url);

                // Check Response
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // Parse JSON
                const data = await response.json();
                console.log("📦 API Response:", data);

                // Get Rate
                const rate = data.rates[to];

                if (!rate) {
                    throw new Error(`No rate found for ${to}`);
                }

                // Calculate
                const result = (amount * rate).toFixed(2);

                // Display Result
                exchangeMsg.textContent = `💱 ${amount} ${from} = ${result} ${to}`;
                console.log(`✅ SUCCESS: ${amount} ${from} = ${result} ${to} @ ${rate}`);

            } catch (error) {
                console.error("❌ ERROR:", error.message);
                exchangeMsg.textContent = `❌ Error: ${error.message}`;
            }
        }

    </script>
</body>

</html>
